services:
  - type: web
    name: socialgram
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT SocailMeadia.asgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "socialgram.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://socialgram.onrender.com"
      - key: GEMINI_API_KEY
        sync: false   # You will paste this manually in Render dashboard
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
