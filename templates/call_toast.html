<div id="call-toast" style="display:none; position:fixed; bottom:24px; right:24px; background:var(--panel,#121826); border:1px solid var(--cyan,#4FE3C1); border-radius:12px; padding:16px; z-index:9999; box-shadow:0 10px 25px rgba(0,0,0,0.5); flex-direction:column; gap:12px; width:300px; font-family:'Inter',sans-serif;">
  <div style="display:flex; align-items:center; gap:12px;">
    <div id="ring-icon" style="width:48px; height:48px; border-radius:50%; background:var(--cyan,#4FE3C1); display:flex; align-items:center; justify-content:center; flex-shrink:0; animation: ringPulse 1.2s ease-in-out infinite;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#06231D" stroke-width="2" style="width:22px;height:22px;"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    </div>
    <div>
      <h4 style="margin:0; font-size:15px; color:var(--text,#E7ECF3);" id="caller-name">Caller Name</h4>
      <p style="margin:0; font-size:12px; color:var(--cyan,#4FE3C1);" id="call-type-label">Incoming Call...</p>
    </div>
  </div>
  <!-- Normal buttons (when NOT already in a call) -->
  <div id="toast-normal-btns" style="display:flex; gap:8px;">
    <button id="decline-toast-btn" style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--line,#232C40); background:none; color:var(--muted,#8B93A7); cursor:pointer; font-size:13px;">Decline</button>
    <button id="accept-toast-btn" style="flex:1; padding:10px; border-radius:8px; border:none; background:#22C55E; color:#fff; font-weight:600; font-size:13px; cursor:pointer;">Accept</button>
  </div>
  <!-- Merge/Reject buttons (when already in a call) -->
  <div id="toast-merge-btns" style="display:none; flex-direction:column; gap:8px;">
    <p style="margin:0; font-size:11px; color:var(--muted,#8B93A7); text-align:center;">You are already on a call</p>
    <div style="display:flex; gap:8px;">
      <button id="reject-toast-btn" style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--line,#232C40); background:none; color:var(--muted,#8B93A7); cursor:pointer; font-size:13px;">Reject</button>
      <button id="merge-toast-btn" style="flex:1; padding:10px; border-radius:8px; border:none; background:#8B5CF6; color:#fff; font-weight:600; font-size:13px; cursor:pointer;">Merge Call</button>
    </div>
  </div>
</div>

<style>
  @keyframes ringPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(79,227,193,0.5); }
    50% { box-shadow: 0 0 0 14px rgba(79,227,193,0); }
  }
</style>

<script>
(function() {
  if (Notification.permission === 'default') {
    Notification.requestPermission();
  }

  window._incomingCallData = null;
  let notifWS = null;

  function connectNotifWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    notifWS = new WebSocket(`${proto}://${location.host}/ws/notifications/`);
    
    notifWS.onopen = () => {
      console.log('[Notifications] WebSocket connected');
    };

    notifWS.onmessage = function(e) {
      const data = JSON.parse(e.data);
      console.log('[Notifications] Received:', data);
      
      if (data.notification_type === 'incoming_call') {
        window._incomingCallData = data;
        
        // Update toast UI
        document.getElementById('caller-name').innerText = data.caller_name;
        document.getElementById('call-type-label').innerText = 
          (data.is_video ? 'Incoming Video Call...' : 'Incoming Voice Call...');
        
        // Check if user is already in a call
        const callOverlay = document.getElementById('callOverlay');
        const alreadyInCall = callOverlay && callOverlay.classList.contains('active');
        
        if (alreadyInCall) {
          // Show merge/reject buttons
          document.getElementById('toast-normal-btns').style.display = 'none';
          document.getElementById('toast-merge-btns').style.display = 'flex';
        } else {
          // Show normal accept/decline buttons
          document.getElementById('toast-normal-btns').style.display = 'flex';
          document.getElementById('toast-merge-btns').style.display = 'none';
        }
        
        document.getElementById('call-toast').style.display = 'flex';
        
        // Browser notification
        if (Notification.permission === 'granted') {
          const n = new Notification("Incoming call from " + data.caller_name, {
            body: data.is_video ? "Video Call" : "Voice Call",
            requireInteraction: true
          });
          n.onclick = () => { window.focus(); n.close(); };
        }
      }
    };
    
    notifWS.onclose = () => {
      console.log('[Notifications] WebSocket closed, reconnecting in 3s...');
      setTimeout(connectNotifWS, 3000);
    };
    
    notifWS.onerror = () => { notifWS.close(); };
  }

  connectNotifWS();

  function hideToast() {
    document.getElementById('call-toast').style.display = 'none';
    window._incomingCallData = null;
  }

  // Decline button (not in a call)
  document.getElementById('decline-toast-btn').onclick = hideToast;

  // Reject button (already in a call)
  document.getElementById('reject-toast-btn').onclick = hideToast;

  // Accept button (not in a call) — navigate to conversation with auto_join
  document.getElementById('accept-toast-btn').onclick = function() {
    const data = window._incomingCallData;
    if (!data) return;
    hideToast();
    const callMode = data.is_video ? 'video' : 'audio';
    if (data.group_id) {
      window.location.href = `/messages/group/${data.group_id}/?auto_join=${callMode}`;
    } else {
      window.location.href = `/messages/${data.caller_id}/?auto_join=${callMode}`;
    }
  };

  // Merge button (already in a call) — create group and redirect
  document.getElementById('merge-toast-btn').onclick = async function() {
    const data = window._incomingCallData;
    if (!data) return;
    
    // Get the current partner ID from the page (set by conversation.html)
    const currentPartnerId = window._currentCallPartnerId;
    const newCallerId = data.caller_id;
    
    if (!currentPartnerId || !newCallerId) {
      alert('Cannot merge: missing call info');
      hideToast();
      return;
    }

    // Get CSRF token from meta tag or cookie
    const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content ||
                      document.querySelector('[name=csrfmiddlewaretoken]')?.value || 
                      document.cookie.split(';').find(c => c.trim().startsWith('csrftoken='))?.split('=')[1];

    try {
      const formData = new FormData();
      formData.append('current_partner_id', currentPartnerId);
      formData.append('new_caller_id', newCallerId);

      const resp = await fetch('/messages/merge-call/', {
        method: 'POST',
        headers: { 'X-CSRFToken': csrfToken },
        body: formData
      });
      
      if (resp.ok) {
        const result = await resp.json();
        hideToast();
        // End the current call first
        if (typeof hangUp === 'function') hangUp();
        // Redirect to the group call
        window.location.href = result.group_url;
      } else {
        alert('Failed to merge call');
        hideToast();
      }
    } catch(err) {
      console.error('Merge call error:', err);
      alert('Failed to merge call');
      hideToast();
    }
  };
})();
</script>
