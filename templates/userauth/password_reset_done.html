{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Sent - Socialgram</title>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0F1A;
    --paper: #121826;
    --text: #E7ECF3;
    --muted: #8B93A7;
    --line: #232C40;
    --focus: #4FE3C1;
    --glow-a: #4FE3C1;
    --glow-b: #6366F1;
    --glow-c: #EC4899;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stage {
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
    width:100%;
    max-width:380px;
  }
  .card {
    width:100%;
    background:var(--paper);
    border-radius:18px;
    padding:40px 32px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.55);
    text-align:center;
    animation:rise 0.7s cubic-bezier(.2,.9,.25,1) forwards;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(28px) scale(0.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  .logo {
    font-family:'Grand Hotel', cursive;
    font-size:2.9rem;
    margin:6px 0 16px;
    background:linear-gradient(90deg, var(--glow-c), var(--glow-b) 55%, var(--glow-a));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .message {
    color:var(--muted);
    font-size:0.95rem;
    line-height:1.5;
    margin-bottom:24px;
  }
  .submit {
    display:inline-block;
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    font-family:inherit;
    font-weight:600;
    font-size:0.95rem;
    color:#0B0F1A;
    background:var(--focus);
    text-decoration:none;
    cursor:pointer;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <div class="logo">Socialgram</div>
      <p class="message">We've emailed you instructions for setting your password, if an account exists with the email you entered. You should receive them shortly.</p>
      <a href="{% url 'login' %}" class="submit">Back to Login</a>
    </div>
  </div>
</body>
</html>
